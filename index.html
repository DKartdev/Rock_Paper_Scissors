<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="rps.css" />
    <script src="rock_paper_scissors.js" defer></script>
  </head>
  <body>

    <div class="start-container"> 
    <h1 id="human-choice-click">Please click on your choice!</h1>
    </div>
    <div id="button-container">
    
<div class="button-choice-container">
      <h2 >Scissors </h2>
        <button type="button">
          <img
            id="scissors"
            src="img/pexels-octavian-6655146.jpg"
            alt="scissors"
            width="200"
            height="200"
          />
        </button>
     </div>

     <div class="button-choice-container">
      <h2>Rock</h2>
        <button type="button">
          <img
            id="rock"
            src="img/pexels-raymond-petrik-1448389535-28458034.jpg"
            alt="rock"
            width="200"
            height="200"
          />
        </button>
      </div>

      <div class="button-choice-container">

      <h2>Paper </h2>
        <button type="button">
          <img
            id="paper"
            src="img/pexels-eva-bronzini-8072474.jpg"
            alt="paper"
            width="200"
            height="200"
          />
        </button>
     </div>
    </div>


<div class="result-output-container">  

  <div class="output-container">
    <div id="result-container"></div>
</div>

    <div class="output-container">
    <div id="result"></div>
</div>
<div class="output-container">
    <div id="count-of-rounds"></div>
</div>
<div class="output-container">
    <div id="human-score"></div>
</div>

    <div class="output-container">
    <div id="computer-score"></div>
</div>

</div>



  </body>
</html>
